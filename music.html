<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#ff5fa2"><title>Birthday Music 🎵</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#4a2440;background:radial-gradient(circle at 15% 10%,#ffd9ed,transparent 35%),radial-gradient(circle at 85% 90%,#dcd8ff,transparent 35%),linear-gradient(135deg,#fff6fb,#f5f1ff);display:grid;place-items:center;padding:22px}.card{width:min(700px,100%);padding:32px;border:1px solid #fff;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 25px 70px rgba(128,58,106,.18);text-align:center}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#ffe2f0;color:#d63384;font-weight:700}.emoji{font-size:70px;margin:12px}.title{font-family:'Baloo 2';font-size:42px;line-height:1;margin:5px 0 8px}.sub{color:#7c6171}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 14px}.tab{background:white;color:#c52c78;border:1px solid #f1bfd7;border-radius:14px;padding:11px 15px;font:700 14px Poppins;cursor:pointer}.tab.active{background:linear-gradient(135deg,#ff5fa2,#ff8fbd);color:white}.panel{display:none}.panel.active{display:block}.name,.api,.url{width:100%;padding:13px;border:1px solid #e7c8d9;border-radius:13px;font:inherit;margin-top:10px}.api{font-size:13px}.upload{display:block;margin:16px 0;padding:16px;border:2px dashed #ef9bc2;border-radius:18px;background:#fff7fb;cursor:pointer;font-weight:700;color:#c52c78}.upload input{display:block;width:100%;margin-top:10px}.player{margin:18px 0;padding:20px;border-radius:22px;background:#fff}.track{font-weight:700;margin-bottom:12px;word-break:break-word}audio{width:100%}.embed{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;margin-top:15px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}button,.link{border:0;border-radius:14px;padding:12px 18px;font:700 15px Poppins;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,#ff5fa2,#ff8fbd);color:white;box-shadow:0 8px 22px #ff5fa244}.secondary{background:white;color:#c52c78;border:1px solid #f1bfd7}.hint{font-size:12px;color:#8d7381;margin-top:18px}.status{font-size:13px;min-height:20px;margin:10px 0;color:#c52c78}.small{font-size:11px;color:#8d7381;margin-top:6px}.provider{font-size:13px;color:#7c6171;margin-top:4px}
</style></head>
<body>
<div class="card"><div class="badge">🎀 Birthday Music</div><div class="emoji">🎵💖</div><h1 class="title">Your Birthday Song</h1><p class="sub">YouTube, Spotify, direct song URL ya Render upload — sab ek jagah.</p>
<div class="tabs"><button class="tab active" data-tab="url">🔗 Song URL</button><button class="tab" data-tab="youtube">▶️ YouTube</button><button class="tab" data-tab="spotify">🎧 Spotify</button><button class="tab" data-tab="upload">☁️ Upload</button></div>
<div id="url" class="panel active"><input id="songUrl" class="url" placeholder="https://...mp3 / audio URL"><input id="urlTitle" class="name" maxlength="80" placeholder="Song name (optional)"><div class="buttons"><button class="primary" id="loadUrl">▶️ Play Song</button></div></div>
<div id="youtube" class="panel"><input id="youtubeUrl" class="url" placeholder="Paste YouTube video URL"><input id="youtubeTitle" class="name" maxlength="80" placeholder="Song name (optional)"><div class="buttons"><button class="primary" id="loadYoutube">▶️ Play YouTube</button></div></div>
<div id="spotify" class="panel"><input id="spotifyUrl" class="url" placeholder="Paste Spotify track URL"><input id="spotifyTitle" class="name" maxlength="80" placeholder="Song name (optional)"><div class="buttons"><button class="primary" id="loadSpotify">🎧 Play Spotify</button></div></div>
<div id="upload" class="panel"><input id="apiUrl" class="api" placeholder="Render API URL — https://zyvora-birthday-music.onrender.com"><div class="small">Render API connected.</div><label class="upload">🎶 Upload Music<input id="musicUpload" type="file" accept="audio/*"></label><input id="musicName" class="name" maxlength="80" placeholder="Music name (optional)"></div>
<div class="status" id="status"></div><div class="player"><div id="trackName" class="track">🎵 Birthday Music</div><div id="mediaArea"><audio id="player" controls loop preload="metadata"><source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7d2a5c1f8f.mp3" type="audio/mpeg"></audio></div></div>
<div class="buttons"><button class="primary" id="shareBtn">📤 Share Music</button><a class="link secondary" href="./">🎂 Birthday Page</a></div><p class="hint">YouTube aur Spotify official embeds use karte hain. Direct URL ke liye audio/MP3 URL chahiye.</p></div>
<script>
const DEFAULT_API='https://zyvora-birthday-music.onrender.com';
const $=id=>document.getElementById(id),status=$('status'),track=$('trackName'),media=$('mediaArea');
function cleanTitle(v,f='Birthday Music'){return (v||'').trim()||f}
function setAudio(src,title){media.innerHTML='<audio id="player" controls loop autoplay preload="metadata"></audio>';const p=$('player');p.src=src;p.play().catch(()=>{});track.textContent='🎵 '+cleanTitle(title);status.textContent='✅ Song loaded.'}
function setEmbed(src,title){media.innerHTML='<iframe class="embed" src="'+src+'" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>';track.textContent='🎵 '+cleanTitle(title);status.textContent='✅ Player loaded.'}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')}));
$('loadUrl').onclick=()=>{const u=$('songUrl').value.trim();if(!/^https?:\/\//i.test(u))return status.textContent='❌ Valid song URL paste karo.';setAudio(u,$('urlTitle').value);history.replaceState({},'',location.pathname+'?music='+encodeURIComponent(u)+'&title='+encodeURIComponent(cleanTitle($('urlTitle').value))) };
function ytId(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1).split('/')[0];if(x.hostname.includes('youtube.com'))return x.searchParams.get('v')||x.pathname.split('/').filter(Boolean).pop();}catch(e){}return null}
$('loadYoutube').onclick=()=>{const id=ytId($('youtubeUrl').value.trim());if(!id)return status.textContent='❌ Valid YouTube URL paste karo.';setEmbed('https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1',$('youtubeTitle').value||'YouTube Music');history.replaceState({},'',location.pathname+'?youtube='+encodeURIComponent(id)+'&title='+encodeURIComponent(cleanTitle($('youtubeTitle').value,'YouTube Music')))};
function spotifyId(u){try{const x=new URL(u);const m=x.pathname.match(/\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);return m?m[1]+'/'+m[2]:null}catch(e){return null}}
$('loadSpotify').onclick=()=>{const id=spotifyId($('spotifyUrl').value.trim());if(!id)return status.textContent='❌ Valid Spotify URL paste karo.';setEmbed('https://open.spotify.com/embed/'+id+'?utm_source=generator',$('spotifyTitle').value||'Spotify Music');history.replaceState({},'',location.pathname+'?spotify='+encodeURIComponent(id)+'&title='+encodeURIComponent(cleanTitle($('spotifyTitle').value,'Spotify Music')))};
const api=$('apiUrl'),upload=$('musicUpload'),name=$('musicName');api.value=localStorage.getItem('bdRenderApiUrl')||DEFAULT_API;api.addEventListener('change',()=>localStorage.setItem('bdRenderApiUrl',api.value.trim().replace(/\/$/,'')));
upload.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('audio/'))return alert('Please choose an audio file.');if(f.size>25*1024*1024)return alert('Please choose audio under 25 MB.');const base=api.value.trim().replace(/\/$/,'');const fd=new FormData();fd.append('music',f);fd.append('title',name.value.trim()||f.name);status.textContent='⏳ Uploading to Render...';upload.disabled=true;try{const r=await fetch(base+'/api/music',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'Upload failed');setAudio(data.url,data.title);history.replaceState({},'',location.pathname+'?music='+encodeURIComponent(data.url)+'&title='+encodeURIComponent(data.title));status.textContent='✅ Uploaded to Render!'}catch(err){status.textContent='❌ '+err.message}finally{upload.disabled=false}});
const params=new URLSearchParams(location.search);if(params.get('youtube'))setEmbed('https://www.youtube.com/embed/'+encodeURIComponent(params.get('youtube'))+'?autoplay=1',params.get('title')||'YouTube Music');else if(params.get('spotify'))setEmbed('https://open.spotify.com/embed/'+params.get('spotify')+'?utm_source=generator',params.get('title')||'Spotify Music');else if(params.get('music'))setAudio(params.get('music'),params.get('title'));
$('shareBtn').onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({title:'Birthday Music 🎵',text:'Listen to this birthday music 💖',url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);status.textContent='💖 Music link copied!'}catch(e){prompt('Copy this music link:',url)}}};
</script></body></html>
